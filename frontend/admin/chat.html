<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tư vấn / Chat - Admin</title>
    <script src="../js/check-auth.js" defer></script>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <style>
        .chat-wrap { display:flex; height:calc(100vh - 140px); background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.06); }
        .conv-list { width:300px; border-right:1px solid #eee; overflow-y:auto; }
        .conv-item { padding:14px 16px; border-bottom:1px solid #f3f4f6; cursor:pointer; }
        .conv-item:hover { background:#f9fafb; }
        .conv-item.active { background:#fff3ef; border-left:3px solid #ff5722; }
        .conv-item .name { font-weight:600; font-size:14px; color:#111; display:flex; justify-content:space-between; align-items:center; }
        .conv-item .badge { background:#ef4444; color:#fff; border-radius:999px; font-size:11px; padding:1px 7px; }
        .conv-item .preview { font-size:12px; color:#6b7280; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .chat-pane { flex:1; display:flex; flex-direction:column; }
        .chat-pane-header { padding:14px 18px; border-bottom:1px solid #eee; font-weight:600; }
        .chat-thread { flex:1; padding:16px; overflow-y:auto; background:#f9fafb; display:flex; flex-direction:column; gap:8px; }
        .bubble { max-width:65%; padding:9px 13px; border-radius:12px; font-size:14px; line-height:1.4; word-wrap:break-word; }
        .bubble.admin { align-self:flex-end; background:#ff5722; color:#fff; border-bottom-right-radius:2px; }
        .bubble.customer { align-self:flex-start; background:#e5e7eb; color:#111; border-bottom-left-radius:2px; }
        .bubble .time { display:block; font-size:10px; opacity:.7; margin-top:3px; }
        .chat-input-bar { display:flex; gap:8px; padding:12px; border-top:1px solid #eee; }
        .chat-input-bar input { flex:1; border:1px solid #ddd; border-radius:20px; padding:10px 16px; font-size:14px; outline:none; }
        .chat-input-bar button { background:#ff5722; color:#fff; border:none; border-radius:20px; padding:0 20px; cursor:pointer; }
        .empty-hint { margin:auto; color:#9ca3af; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="sidebarMenu"></aside>
        <main class="admin-content">
            <header class="content-header">
                <h1>TRUNG TÂM TƯ VẤN KHÁCH HÀNG</h1>
                <p>Trò chuyện trực tuyến, hỗ trợ khách hàng theo thời gian thực</p>
            </header>
 
            <div class="chat-wrap">
                <div class="conv-list" id="convList"></div>
                <div class="chat-pane">
                    <div class="chat-pane-header" id="chatPaneHeader">Chọn một cuộc trò chuyện để bắt đầu</div>
                    <div class="chat-thread" id="chatThread">
                        <div class="empty-hint">← Chọn khách hàng ở danh sách bên trái</div>
                    </div>
                    <div class="chat-input-bar" id="chatInputBar" style="display:none;">
                        <input type="text" id="adminChatInput" placeholder="Nhập nội dung tư vấn..." autocomplete="off">
                        <button id="adminChatSend">Gửi</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
 
    <script src="http://localhost:5000/socket.io/socket.io.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/sidebar-loader.js"></script>
    <script src="../js/admin-chat.js"></script>
</body>
</html>
