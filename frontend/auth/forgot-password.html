<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - EBikes System</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>RECOVER_ACCESS</h2>
                <p>Yêu cầu khôi phục quyền truy cập mạng lưới</p>
            </div>

            <p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 25px; line-height: 1.5;">
                Nhập Email định danh của bạn. Hệ thống sẽ gửi một liên kết Token để thiết lập lại mật mã an toàn.
            </p>

            <form id="forgotForm">
                <div class="form-group">
                    <label>Email đã đăng ký</label>
                    <input type="email" id="forgot_email" required placeholder="Nhập email của bạn...">
                </div>

                <button type="submit" class="btn-login" style="margin-top: 15px;">GỬI MÃ KHÔI PHỤC</button>
            </form>

            <div class="auth-footer">
                <a href="login.html">← Quay lại màn hình đăng nhập</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
