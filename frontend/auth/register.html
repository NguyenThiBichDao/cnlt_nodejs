<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - E-BIKES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            /* Ảnh nền du lịch đồng bộ với trang Đăng nhập */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-box {
    width: 420px;
    background: rgba(255, 255, 255, 0.95);
    padding: 40px 30px;
    border-radius: 15px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    text-align: center;
    position: relative; /* Thêm dòng này để chắc chắn form nổi lên trên cùng */
    z-index: 10;        /* Thêm dòng này để đẩy form lên trên lớp nền */
}

        .brand-title {
            color: #e65100; /* Màu cam du lịch bụi */
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .brand-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #444;
            font-weight: 600;
            font-size: 13px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: #e65100;
            box-shadow: 0 0 5px rgba(230, 81, 0, 0.3);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            background: #e65100;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 15px;
        }
        .btn-submit:hover {
            background: #bf4300;
        }
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }
        .footer-link a {
            color: #e65100;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }
        .footer-link a:hover {
            text-decoration: underline;
            color: #bf4300;
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <div class="brand-title">E-Bikes Rental</div>
        <div class="brand-subtitle">Gia nhập cộng đồng phượt xe máy ngay hôm nay</div>
        
        <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
        
        <form id="registerForm">
            <div class="form-group">
                <input type="text" id="regName" class="form-control" placeholder="Họ và tên" required>
            </div>
            <div class="form-group">
                <input type="email" id="regEmail" class="form-control" placeholder="Email đăng nhập" required>
            </div>
            <div class="form-group">
                <input type="password" id="regPass" class="form-control" placeholder="Mật khẩu" required>
            </div>
            <!-- ĐÃ THÊM: Ô nhập số điện thoại để sửa lỗi db block -->
            <div class="form-group">
                <input type="text" id="regPhone" class="form-control" placeholder="Số điện thoại" required>
            </div>
            <div class="form-group">
                <label>CHỌN VAI TRÒ</label>
                <select id="regRole" class="form-control">
                    <option value="customer">Customer</option>
                   
                    <option value="admin">Admin</option> <!-- ĐÃ SỬA: Sửa lại value chính xác thành admin -->
                </select>
            </div>
            <button type="submit" class="btn-submit">XÁC NHẬN ĐĂNG KÝ</button>
        </form>
        <div class="footer-link">
            <a href="login.html">Đã có tài khoản? Quay lại Đăng nhập</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const hoTen = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPass').value;
            const soDienThoai = document.getElementById('regPhone').value.trim(); // ĐÃ THÊM: Lấy giá trị số điện thoại
            const role = document.getElementById('regRole').value;

            try {
                const res = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // ĐÃ SỬA: Bổ sung thêm so_dien_thoai và vai_tro (hoặc role tùy backend nhận diện) gửi lên server
                    body: JSON.stringify({ 
                        ho_ten: hoTen, 
                        email, 
                        password, 
                        so_dien_thoai: soDienThoai, 
                        vai_tro: role 
                    })
                });
                
                const data = await res.json();
                if (res.ok && data.success) {
                    alert("🎉 " + (data.message || "Đăng ký thành công!"));
                    window.location.href = "login.html";
                } else {
                    alert("❌ " + (data.message || "Đăng ký thất bại."));
                }
            } catch (error) {
                console.error(error);
                alert('❌ Không thể kết nối đến máy chủ!');
            }
        });
    </script>
</body>
</html>
