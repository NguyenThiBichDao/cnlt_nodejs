<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu - EBikes System</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>RESET_PASSWORD</h2>
                <p>Khởi tạo chuỗi mật mã bảo mật mới</p>
            </div>

            <form id="resetForm">
                <div class="form-group">
                    <label>Mật mã mới</label>
                    <input type="password" id="new_password" required placeholder="Nhập mật khẩu mới...">
                </div>
                <div class="form-group">
                    <label>Xác nhận lại mật mã</label>
                    <input type="password" id="confirm_password" required placeholder="Nhập lại mật khẩu mới...">
                </div>

                <button type="submit" class="btn-login" style="margin-top: 15px;">CẬP NHẬT MẬT MÃ</button>
            </form>

            <div class="auth-footer">
                <a href="login.html">Hủy bỏ & Về trang đăng nhập</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
